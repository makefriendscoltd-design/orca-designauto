<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url("assets/pretendard/Pretendard-Regular.woff2");font-weight:400}
@font-face{font-family:P;src:url("assets/pretendard/Pretendard-Bold.woff2");font-weight:700}
@font-face{font-family:P;src:url("assets/pretendard/Pretendard-ExtraBold.woff2");font-weight:800}
html{width:1000px;height:1000px;overflow:hidden}
*{box-sizing:border-box;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{width:1000px;height:1000px;overflow:hidden;font-family:P,sans-serif;color:#fff;word-break:keep-all}
.c{position:relative;width:1000px;height:1000px;overflow:hidden;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 44%,#172554 100%)}
.glow{position:absolute;left:-10%;top:-18%;width:92%;height:72%;
  background:radial-gradient(closest-side,rgba(147,197,253,.42),rgba(147,197,253,0))}
.ph{position:absolute;right:-30px;bottom:0;height:790px;object-fit:contain;object-position:bottom right;z-index:2;filter:drop-shadow(0 18px 44px rgba(0,0,0,.45))}
.sh{display:none}
.in{position:absolute;left:62px;top:66px;right:300px;z-index:3}
.bd{display:inline-block;border:2px solid rgba(255,255,255,.5);border-radius:999px;
  padding:9px 20px;font-size:25px;font-weight:800;letter-spacing:.02em}
h1{margin-top:40px;font-size:96px;line-height:1.14;letter-spacing:-.07em;font-weight:800}
h1 em{font-style:normal;color:#facc15}
.sub{margin-top:30px;font-size:30px;line-height:1.55;color:#cfe0ff;font-weight:700}
.ft{position:absolute;left:62px;bottom:62px;right:62px;z-index:3;display:flex;
  align-items:center;justify-content:space-between;gap:16px}
.ft .nm{font-size:30px;font-weight:800}
.ft .nm span{color:#93c5fd;font-weight:700}
.ft .tag{display:flex;gap:9px}
.ft .tag b{font-size:24px;font-weight:800;background:rgba(255,255,255,.17);
  border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px 16px}
</style></head><body><div class="c">
  <div class="glow"></div>
  <img class="ph" src="assets/char/namin_cut.png" alt="">
  <div class="sh"></div>
  <div class="in">
    <span class="bd">AIxSCHOOL</span>
    <h1>직원 뽑기 전에,<br><em>AI 직원부터.</em></h1>
    <div class="sub">내 일을 대신할 직원을<br>직접 만들어 쓰는 1년 과정</div>
  </div>
  <div class="ft">
    <div class="nm">AIxSCHOOL 교장 <span>나민수</span></div>
    <div class="tag"><b>6팀 24직군</b><b>정원 30명</b></div>
  </div>
</div></body></html>
